<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Byte Bakers icon">
  <title>Byte Bakers</title>
  <!-- Concept: chef hat whose band is an 8-bit chip (section 10) -->
  <rect width="512" height="512" rx="96" fill="#1F2937"/>
  <!-- hat puff -->
  <ellipse cx="256" cy="190" rx="150" ry="110" fill="#F1EFE8"/>
  <ellipse cx="170" cy="210" rx="70" ry="55" fill="#F1EFE8"/>
  <ellipse cx="342" cy="210" rx="70" ry="55" fill="#F1EFE8"/>
  <!-- chip band -->
  <rect x="118" y="250" width="276" height="88" rx="14" fill="#D85A30"/>
  <!-- 8 pins / bits -->
  <g fill="#EF9F27">
    <rect x="142" y="270" width="18" height="48" rx="3"/>
    <rect x="174" y="270" width="18" height="48" rx="3"/>
    <rect x="206" y="270" width="18" height="48" rx="3"/>
    <rect x="238" y="270" width="18" height="48" rx="3"/>
    <rect x="270" y="270" width="18" height="48" rx="3"/>
    <rect x="302" y="270" width="18" height="48" rx="3"/>
    <rect x="334" y="270" width="18" height="48" rx="3"/>
    <rect x="366" y="270" width="18" height="48" rx="3"/>
  </g>
  <!-- bit labels 1 0 1 1 0 0 1 0 -->
  <g fill="#1F2937" font-family="Consolas, Cascadia Mono, monospace" font-size="20" font-weight="700" text-anchor="middle">
    <text x="151" y="302">1</text>
    <text x="183" y="302">0</text>
    <text x="215" y="302">1</text>
    <text x="247" y="302">1</text>
    <text x="279" y="302">0</text>
    <text x="311" y="302">0</text>
    <text x="343" y="302">1</text>
    <text x="375" y="302">0</text>
  </g>
  <!-- soft underline wire -->
  <rect x="150" y="370" width="212" height="10" rx="5" fill="#B4B2A9"/>
</svg>
